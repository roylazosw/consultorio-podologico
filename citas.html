<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie saludable - Portal Público de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col justify-between">

    <!-- Cabecera -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-50 p-2 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-center w-12 h-12 flex-shrink-0">
                    <svg viewBox="0 0 512 512" class="w-7 h-7" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M110 90C90 90 75 110 80 145C85 175 115 195 130 180C145 165 140 110 125 95C120 90 115 90 110 90Z" fill="#a21caf"/>
                        <ellipse cx="190" cy="85" rx="20" ry="35" transform="rotate(-10 190 85)" fill="#84cc16"/>
                        <ellipse cx="250" cy="85" rx="18" ry="32" transform="rotate(5 250 85)" fill="#84cc16"/>
                        <ellipse cx="305" cy="100" rx="16" ry="28" transform="rotate(20 305 100)" fill="#84cc16"/>
                        <ellipse cx="350" cy="130" rx="14" ry="24" transform="rotate(35 350 130)" fill="#84cc16"/>
                        <path d="M125 155C125 155 190 220 250 280C310 340 340 375 320 405C305 425 270 425 240 395C210 365 155 305 125 275C115 265 105 245 115 215C125 185 135 165 125 155Z" fill="#a21caf"/>
                        <path d="M225 385C200 395 180 390 170 375C155 355 175 335 205 325C235 315 275 330 290 355C305 380 285 415 240 435C220 444 195 440 180 425" stroke="#84cc16" stroke-width="20" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-wide">Pie saludable</h1>
                    <p class="text-[11px] text-emerald-600 font-semibold uppercase tracking-wider">Portal Público de Citas</p>
                </div>
            </div>
            
            <!-- Botón de Acceso Clínico que lleva al login -->
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-200 flex items-center gap-1.5 shadow-sm cursor-pointer relative z-50">
                <i class="fa-solid fa-lock text-emerald-600"></i> Acceso Clínico
            </a>
        </div>
    </header>

    <!-- Contenido (Imagen 1) -->
    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            
            <!-- Formulario de Cita -->
            <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-5">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-plus text-emerald-600"></i> Reserva tu Cita Podológica
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">Completa tus datos y selecciona el horario de tu preferencia.</p>
                </div>

                <form onsubmit="savePublicAppointment(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo *</label>
                        <input type="text" id="pubNombre" required placeholder="Ej. Juan Pérez" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Edad *</label>
                        <input type="number" id="pubEdad" required placeholder="Ej. 35" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono *</label>
                        <input type="tel" id="pubTelefono" required placeholder="Ej. 55 1234 5678" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha *</label>
                            <input type="date" id="pubFecha" required onchange="checkBookedHours()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Hora *</label>
                            <input type="time" id="pubHora" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Motivo</label>
                        <input type="text" id="pubMotivo" placeholder="Ej. Uña encarnada..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>

                    <div id="pubAlert" class="hidden text-xs p-3 rounded-xl border text-center font-medium"></div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-sm font-semibold transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-check"></i> Confirmar Cita
                    </button>
                </form>
            </div>

            <!-- Horarios Ocupados -->
            <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
                <h3 class="text-md font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-clock text-amber-500"></i> Horarios Ocupados
                </h3>
                <div id="bookedHoursContainer" class="space-y-2">
                    <div class="text-center py-10 text-slate-400 text-xs">Selecciona una fecha para ver horarios apartados.</div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-8">
        Pie saludable © 2026 • Todos los derechos reservados
    </footer>

    <script>
        const SUPABASE_URL = 'https://ajjiliervgekpgjkguuf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_92ubysrRZJLz69DIwHBSkw_y-PE71KE';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkBookedHours() {
            const fecha = document.getElementById('pubFecha').value;
            const container = document.getElementById('bookedHoursContainer');
            if (!fecha) return;

            const { data } = await _supabase.from('citas').select('hora, status').eq('fecha', fecha);
            const citasDelDia = data || [];

            if (citasDelDia.length === 0) {
                container.innerHTML = `<div class="bg-emerald-50 border border-emerald-100 text-emerald-700 p-3 rounded-2xl text-xs text-center">¡Todos los horarios libres para esta fecha!</div>`;
                return;
            }

            container.innerHTML = '';
            citasDelDia.forEach(c => {
                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-800"><i class="fa-solid fa-clock text-slate-400 mr-1"></i> ${c.hora} hrs</span>
                        <span class="px-2 py-0.5 rounded font-medium border text-[10px] ${c.status === 'Cancelada' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">${c.status}</span>
                    </div>`;
            });
        }

        async function savePublicAppointment(e) {
            e.preventDefault();
            const nombre = document.getElementById('pubNombre').value.trim();
            const edad = parseInt(document.getElementById('pubEdad').value);
            const telefono = document.getElementById('pubTelefono').value.trim();
            const fecha = document.getElementById('pubFecha').value;
            const hora = document.getElementById('pubHora').value;
            const motivo = document.getElementById('pubMotivo').value.trim() || 'Cita pública';
            const alertDiv = document.getElementById('pubAlert');

            try {
                const pacId = 'pac_' + Date.now();
                await _supabase.from('pacientes').insert([{ id: pacId, nombre, edad, telefono, padecimientos: ["Consulta General"] }]);
                await _supabase.from('citas').insert([{ id: 'cit_' + Date.now(), paciente_id: pacId, fecha, hora, motivo, status: 'Programada' }]);

                alertDiv.className = "text-xs p-3 rounded-xl border text-center font-medium bg-emerald-50 border-emerald-200 text-emerald-700";
                alertDiv.innerHTML = `¡Cita agendada con éxito para el ${fecha} a las ${hora}!`;
                alertDiv.classList.remove('hidden');
                e.target.reset();
                document.getElementById('bookedHoursContainer').innerHTML = `<div class="text-center py-4 text-xs text-emerald-600 font-semibold">¡Cita registrada correctamente!</div>`;
            } catch (err) {
                alertDiv.className = "text-xs p-3 rounded-xl border text-center font-medium bg-red-50 border-red-200 text-red-600";
                alertDiv.innerText = "Error: " + err.message;
                alertDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
