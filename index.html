<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnophone - Consultorio Podológico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Navegación Superior -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-teal-500/10 p-2.5 rounded-xl border border-teal-500/20 text-teal-400">
                    <i class="fa-solid fa-notes-medical text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Consultorio Podológico</h1>
                    <p class="text-xs text-slate-400">Sistema de Expedientes y Citas</p>
                </div>
            </div>
            <!-- Botones de Pestañas -->
            <div class="flex bg-slate-950 p-1.5 rounded-xl border border-slate-800 gap-1">
                <button onclick="switchTab('pacientes')" id="btn-tab-pacientes" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-teal-600 text-white shadow">
                    <i class="fa-solid fa-users mr-2"></i>Pacientes
                </button>
                <button onclick="switchTab('citas')" id="btn-tab-citas" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white">
                    <i class="fa-solid fa-calendar-days mr-2"></i>Agenda de Citas
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- ================= VISTA PACIENTES ================= -->
        <div id="view-pacientes" class="space-y-6">
            <!-- Barra de Herramientas -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="text" id="searchInput" oninput="filterPatients()" placeholder="Buscar por nombre o padecimiento..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white placeholder-slate-500">
                </div>
                <button onclick="openModal('patientModal')" class="w-full md:w-auto bg-teal-600 hover:bg-teal-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-teal-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Nuevo Paciente
                </button>
            </div>

            <!-- Grid de Pacientes -->
            <div id="patientsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

        <!-- ================= VISTA CITAS ================= -->
        <div id="view-citas" class="space-y-6 hidden">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <select id="filterCitaStatus" onchange="renderAppointments()" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-teal-500">
                        <option value="todos">Todas las citas</option>
                        <option value="Programada">Programadas</option>
                        <option value="Completada">Completadas</option>
                        <option value="Cancelada">Canceladas</option>
                    </select>
                </div>
                <button onclick="openModal('appointmentModal')" class="w-full md:w-auto bg-teal-600 hover:bg-teal-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-teal-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calendar-plus"></i> Agendar Cita
                </button>
            </div>

            <!-- Lista de Citas -->
            <div id="appointmentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

    </main>

    <!-- ================= MODAL: NUEVO / EDITAR PACIENTE ================= -->
    <div id="patientModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-6 shadow-2xl my-8">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 id="patientModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-teal-400"></i> Registrar Nuevo Paciente
                </h3>
                <button onclick="closeModal('patientModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="patientForm" onsubmit="savePatient(event)" class="space-y-4">
                <input type="hidden" id="patientId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo *</label>
                        <input type="text" id="nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Edad *</label>
                        <input type="number" id="edad" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Teléfono</label>
                        <input type="tel" id="telefono" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Fotografía del Paciente</label>
                        <input type="file" id="fotoFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-600/10 file:text-teal-400 hover:file:bg-teal-600/20 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Padecimientos Podológicos Frecuentes</label>
                    <div id="padecimientosContainer" class="flex flex-wrap gap-2">
                        <!-- Checkboxes generados por JS -->
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Observaciones / Alergias / Medicamentos</label>
                    <textarea id="observaciones" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal('patientModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Cancelar</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-lg shadow-teal-600/20">Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: AGENDAR CITA ================= -->
    <div id="appointmentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-teal-400"></i> Agendar Nueva Cita
                </h3>
                <button onclick="closeModal('appointmentModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="appointmentForm" onsubmit="saveAppointment(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Seleccionar Paciente *</label>
                    <select id="citaPacienteId" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                        <!-- Opciones de pacientes -->
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Fecha *</label>
                        <input type="date" id="citaFecha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Hora *</label>
                        <input type="time" id="citaHora" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Motivo de la Cita / Tratamiento</label>
                    <input type="text" id="citaMotivo" placeholder="Ej. Corte clínico, revisión pie diabético..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-white">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal('appointmentModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-
