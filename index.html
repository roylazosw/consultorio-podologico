<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie saludable - Sistema Podológico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#0d9488',
                            600: '#0f766e',
                            700: '#115e59',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- Definicón de Gradientes del Logotipo -->
    <svg width="0" height="0" class="absolute">
        <defs>
            <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#14b8a6" />
                <stop offset="100%" stop-color="#0f766e" />
            </linearGradient>
            <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2dd4bf" />
                <stop offset="100%" stop-color="#0d9488" />
            </linearGradient>
        </defs>
    </svg>

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-100 z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-8 space-y-6 shadow-xl">
            <div class="text-center space-y-3">
                <div class="bg-teal-50/60 p-3 rounded-2xl border border-teal-100 shadow-sm inline-flex items-center justify-center w-20 h-20">
                    <svg viewBox="0 0 100 120" class="w-14 h-14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="34" cy="22" r="6" fill="url(#brandGradient)" />
                        <circle cx="50" cy="17" r="5" fill="url(#brandGradient)" />
                        <circle cx="64" cy="20" r="4.5" fill="url(#brandGradient)" />
                        <circle cx="76" cy="27" r="4" fill="url(#brandGradient)" />
                        <path d="M38 36 C46 36, 68 34, 70 48 C72 62, 60 76, 54 90 C48 104, 38 106, 30 96 C24 88, 28 72, 34 60 C38 52, 30 42, 38 36 Z" 
                              stroke="url(#brandGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M 28 62 C 10 56, 4 72, 16 84 C 26 90, 36 80, 32 66 C 30 63, 29 62, 28 62 Z" 
                              fill="url(#leafGradient)" opacity="0.9" />
                        <path d="M 14 78 Q 22 74, 30 66" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Pie saludable</h2>
                <p class="text-xs text-teal-600 font-semibold uppercase tracking-wider">Acceso al Sistema Podológico</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Usuario</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="text" id="loginUsername" required placeholder="admin" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                        <input type="checkbox" id="rememberMe" class="rounded border-slate-300 text-teal-600 focus:ring-0">
                        <span>Recordar contraseña</span>
                    </label>
                </div>

                <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-xl text-center font-medium">
                    Usuario o contraseña incorrectos.
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-white py-3 rounded-xl text-sm font-semibold transition-all shadow-md shadow-teal-600/20 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- ================= CONTENIDO DE LA APLICACIÓN ================= -->
    <div id="appContent" class="hidden">
        <!-- Navegación Superior -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-teal-50/60 p-2 rounded-2xl border border-teal-100 shadow-sm flex items-center justify-center w-12 h-12">
                        <svg viewBox="0 0 100 120" class="w-9 h-9" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="34" cy="22" r="6" fill="url(#brandGradient)" />
                            <circle cx="50" cy="17" r="5" fill="url(#brandGradient)" />
                            <circle cx="64" cy="20" r="4.5" fill="url(#brandGradient)" />
                            <circle cx="76" cy="27" r="4" fill="url(#brandGradient)" />
                            <path d="M38 36 C46 36, 68 34, 70 48 C72 62, 60 76, 54 90 C48 104, 38 106, 30 96 C24 88, 28 72, 34 60 C38 52, 30 42, 38 36 Z" 
                                  stroke="url(#brandGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M 28 62 C 10 56, 4 72, 16 84 C 26 90, 36 80, 32 66 C 30 63, 29 62, 28 62 Z" 
                                  fill="url(#leafGradient)" opacity="0.9" />
                            <path d="M 14 78 Q 22 74, 30 66" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-wide">Pie saludable</h1>
                        <p class="text-xs text-teal-600 font-semibold uppercase tracking-wider">GESTIÓN PODOLÓGICA CLÍNICA</p>
                    </div>
                </div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 gap-1">
                        <button onclick="switchTab('pacientes')" id="btn-tab-pacientes" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all bg-teal-600 text-white shadow cursor-pointer">
                            <i class="fa-solid fa-users mr-1.5"></i>Pacientes
                        </button>
                        <button onclick="switchTab('citas')" id="btn-tab-citas" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900 cursor-pointer">
                            <i class="fa-solid fa-calendar-days mr-1.5"></i>Agenda de Citas
                        </button>
                    </div>
                    <button onclick="openAppointmentModal()" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition-all shadow-md shadow-teal-600/20 flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-calendar-plus"></i> Agendar Cita
                    </button>
                    <button onclick="openPatientModal()" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition-all shadow-md shadow-teal-600/20 flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-user-plus"></i> Nuevo Paciente
                    </button>
                    <button onclick="handleLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all border border-slate-200 flex items-center gap-1.5 cursor-pointer" title="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

            <!-- Tarjetas de Estadísticas (KPIs) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4">
                    <div class="bg-teal-50 text-teal-600 p-3 rounded-xl border border-teal-100 text-lg">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">TOTAL PACIENTES</p>
                        <h3 id="statTotalPacientes" class="text-2xl font-bold text-slate-900">0</h3>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4">
                    <div class="bg-amber-50 text-amber-600 p-3 rounded-xl border border-amber-100 text-lg">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">CITAS PENDIENTES</p>
                        <h3 id="statCitasPendientes" class="text-2xl font-bold text-slate-900">0</h3>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4">
                    <div class="bg-red-50 text-red-600 p-3 rounded-xl border border-red-100 text-lg">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">PACIENTES DIABÉTICOS</p>
                        <h3 id="statPacientesDiabeticos" class="text-2xl font-bold text-slate-900">0</h3>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4">
                    <div class="bg-teal-50 text-teal-600 p-3 rounded-xl border border-teal-100 text-lg">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">CITAS DE HOY</p>
                        <h3 id="statCitasHoy" class="text-2xl font-bold text-slate-900">0</h3>
                    </div>
                </div>
            </div>

            <!-- Vista Pacientes -->
            <div id="view-pacientes" class="space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="relative w-full md:w-96">
                        <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="filterPatients()" placeholder="Buscar por nombre, teléfono o padecimiento..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900 placeholder-slate-400">
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <span class="text-xs text-slate-500 font-medium whitespace-nowrap">Filtrar por:</span>
                        <select id="filterPadecimientosSelect" onchange="filterPatients()" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:border-teal-500 w-full md:w-auto">
                            <option value="todos">Todos los padecimientos</option>
                            <option value="Diabetes">Diabetes Mellitus</option>
                            <option value="Onicocriptosis">Onicocriptosis (Uña encarnada)</option>
                            <option value="Onicomicosis">Onicomicosis (Hongos)</option>
                            <option value="Pie de Atleta">Pie de Atleta</option>
                        </select>
                    </div>
                </div>

                <div id="patientsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </div>

            <!-- Vista Citas -->
            <div id="view-citas" class="space-y-6 hidden">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <select id="filterCitaStatus" onchange="renderAppointments()" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:border-teal-500">
                            <option value="todos">Todas las citas</option>
                            <option value="Programada">Programadas</option>
                            <option value="Completada">Completadas</option>
                            <option value="Cancelada">Canceladas</option>
                        </select>
                    </div>
                </div>

                <div id="appointmentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </div>

        </main>
    </div>

    <!-- MODAL NUEVO / EDITAR PACIENTE -->
    <div id="patientModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-6 space-y-6 shadow-xl my-8">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h3 id="patientModalTitle" class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-teal-600"></i> Registrar Nuevo Paciente
                </h3>
                <button onclick="closeModal('patientModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="patientForm" onsubmit="savePatient(event)" class="space-y-4">
                <input type="hidden" id="editPatientId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo *</label>
                        <input type="text" id="nombre" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Edad *</label>
                        <input type="number" id="edad" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
                        <input type="tel" id="telefono" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fotografía del Paciente</label>
                        <input type="file" id="fotoFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-600 hover:file:bg-teal-100 cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">Padecimientos Podológicos Frecuentes</label>
                    <div id="padecimientosContainer" class="flex flex-wrap gap-2"></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Observaciones / Alergias / Medicamentos</label>
                    <textarea id="observaciones" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('patientModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">Cancelar</button>
                    <button type="submit" id="btnSavePatient" class="px-5 py-2 rounded-xl text-sm font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-md shadow-teal-600/20 cursor-pointer">Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL NUEVO / EDITAR CITA -->
    <div id="appointmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h3 id="appointmentModalTitle" class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-teal-600"></i> Agendar Nueva Cita
                </h3>
                <button onclick="closeModal('appointmentModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="appointmentForm" onsubmit="saveAppointment(event)" class="space-y-4">
                <input type="hidden" id="editAppointmentId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Paciente *</label>
                    <select id="citaPacienteId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Consultorio / Sucursal *</label>
                    <select id="citaConsultorio" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                        <option value="Metepec">Metepec</option>
                        <option value="Toluca">Toluca</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha *</label>
                        <input type="date" id="citaFecha" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hora *</label>
                        <input type="time" id="citaHora" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Motivo de la Cita / Tratamiento</label>
                    <input type="text" id="citaMotivo" placeholder="Ej. Corte clínico, revisión pie diabético..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-slate-900">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('appointmentModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">Cancelar</button>
                    <button type="submit" id="btnSaveAppointment" class="px-5 py-2 rounded-xl text-sm font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-md shadow-teal-600/20 cursor-pointer">Agendar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica del Sistema -->
    <script>
        const SUPABASE_URL = 'https://ajjiliervgekpgjkguuf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_92ubysrRZJLz69DIwHBSkw_y-PE71KE';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const padecimientosDisponibles = [
            "Diabetes Mellitus (Pie Diabético)",
            "Onicocriptosis (Uña encarnada)",
            "Onicomicosis (Hongos en uñas)",
            "Pie de Atleta",
            "Callosidades / Tilomas",
            "Hiperqueratosis"
        ];

        let pacientes = [];
        let citas = [];

        window.onload = function() {
            checkAuth();
        };

        function checkAuth() {
            const isAuthenticated = localStorage.getItem('pieSaludableAuth') === 'true' || sessionStorage.getItem('pieSaludableAuth') === 'true';
            if (isAuthenticated) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                renderPadecimientosCheckboxes();
                loadDataFromCloud();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appContent').classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            const errDiv = document.getElementById('loginError');

            if (user === 'admin' && pass === 'pie123') {
                if (remember) {
                    localStorage.setItem('pieSaludableAuth', 'true');
                } else {
                    sessionStorage.setItem('pieSaludableAuth', 'true');
                }
                errDiv.classList.add('hidden');
                checkAuth();
            } else {
                errDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            if(confirm('¿Deseas cerrar sesión?')) {
                localStorage.removeItem('pieSaludableAuth');
                sessionStorage.removeItem('pieSaludableAuth');
                checkAuth();
            }
        }

        async function loadDataFromCloud() {
            try {
                const { data: pacientesData, error: errPac } = await _supabase.from('pacientes').select('*');
                if (!errPac) pacientes = pacientesData || [];

                const { data: citasData, error: errCit } = await _supabase.from('citas').select('id, paciente_id, fecha, hora, motivo, status');
                if (!errCit) citas = citasData || [];

                updateStats();
                renderPatients();
                renderAppointments();
                updatePatientSelect();
            } catch (e) {
                console.error('Error al cargar datos:', e);
            }
        }

        function updateStats() {
            document.getElementById('statTotalPacientes').innerText = pacientes.length;
            document.getElementById('statCitasPendientes').innerText = citas.filter(c => c.status === 'Programada').length;
            document.getElementById('statPacientesDiabeticos').innerText = pacientes.filter(p => p.padecimientos && p.padecimientos.some(pad => pad.toLowerCase().includes('diabetes'))).length;
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            document.getElementById('statCitasHoy').innerText = citas.filter(c => c.fecha === todayStr && c.status === 'Programada').length;
        }

        function switchTab(tab) {
            const btnPacientes = document.getElementById('btn-tab-pacientes');
            const btnCitas = document.getElementById('btn-tab-citas');
            const viewPacientes = document.getElementById('view-pacientes');
            const viewCitas = document.getElementById('view-citas');

            if (tab === 'pacientes') {
                btnPacientes.className = "px-3.5 py-2 rounded-lg text-xs font-semibold transition-all bg-teal-600 text-white shadow cursor-pointer";
                btnCitas.className = "px-3.5 py-2 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900 cursor-pointer";
                viewPacientes.classList.remove('hidden');
                viewCitas.classList.add('hidden');
            } else {
                btnCitas.className = "px-3.5 py-2 rounded-lg text-xs font-semibold transition-all bg-teal-600 text-white shadow cursor-pointer";
                btnPacientes.className = "px-3.5 py-2 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900 cursor-pointer";
                viewCitas.classList.remove('hidden');
                viewPacientes.classList.add('hidden');
            }
        }

        function renderPadecimientosCheckboxes(selected = []) {
            const container = document.getElementById('padecimientosContainer');
            container.innerHTML = '';
            padecimientosDisponibles.forEach(pad => {
                const isChecked = selected.includes(pad) ? 'checked' : '';
                container.innerHTML += `
                    <label class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs cursor-pointer hover:border-teal-500/50">
                        <input type="checkbox" name="padecimiento" value="${pad}" ${isChecked} class="rounded border-slate-300 bg-white text-teal-600 focus:ring-0">
                        <span class="text-slate-700">${pad}</span>
                    </label>
                `;
            });
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function openPatientModal(id = null) {
            if (id) {
                const p = pacientes.find(item => item.id === id);
                if (!p) return;
                document.getElementById('patientModalTitle').innerHTML = `<i class="fa-solid fa-user-pen text-teal-600"></i> Editar Paciente`;
                document.getElementById('btnSavePatient').innerText = 'Guardar Cambios';
                document.getElementById('editPatientId').value = p.id;
                document.getElementById('nombre').value = p.nombre || '';
                document.getElementById('edad').value = p.edad || '';
                document.getElementById('telefono').value = p.telefono || '';
                document.getElementById('observaciones').value = p.observaciones || '';
                renderPadecimientosCheckboxes(p.padecimientos || []);
            } else {
                document.getElementById('patientModalTitle').innerHTML = `<i class="fa-solid fa-user-plus text-teal-600"></i> Registrar Nuevo Paciente`;
                document.getElementById('btnSavePatient').innerText = 'Guardar Paciente';
                document.getElementById('patientForm').reset();
                document.getElementById('editPatientId').value = '';
                renderPadecimientosCheckboxes([]);
            }
            openModal('patientModal');
        }

        function openAppointmentModal(id = null) {
            updatePatientSelect();
            if (id) {
                const cita = citas.find(c => c.id === id);
                if (!cita) return;

                document.getElementById('appointmentModalTitle').innerHTML = `<i class="fa-solid fa-calendar-pen text-teal-600"></i> Editar Cita`;
                document.getElementById('btnSaveAppointment').innerText = 'Guardar Cambios';
                document.getElementById('editAppointmentId').value = cita.id;
                document.getElementById('citaPacienteId').value = cita.paciente_id;
                document.getElementById('citaFecha').value = cita.fecha;
                document.getElementById('citaHora').value = cita.hora;

                let motivoLimpio = cita.motivo || '';
                if (motivoLimpio.startsWith('[Metepec]')) {
                    document.getElementById('citaConsultorio').value = 'Metepec';
                    motivoLimpio = motivoLimpio.replace('[Metepec]', '').trim();
                } else if (motivoLimpio.startsWith('[Toluca]')) {
                    document.getElementById('citaConsultorio').value = 'Toluca';
                    motivoLimpio = motivoLimpio.replace('[Toluca]', '').trim();
                }
                document.getElementById('citaMotivo').value = motivoLimpio;
            } else {
                document.getElementById('appointmentModalTitle').innerHTML = `<i class="fa-solid fa-calendar-check text-teal-600"></i> Agendar Nueva Cita`;
                document.getElementById('btnSaveAppointment').innerText = 'Agendar';
                document.getElementById('appointmentForm').reset();
                document.getElementById('editAppointmentId').value = '';
            }
            openModal('appointmentModal');
        }

        async function savePatient(e) {
            e.preventDefault();
            const editId = document.getElementById('editPatientId').value;
            const nombre = document.getElementById('nombre').value;
            const edad = parseInt(document.getElementById('edad').value);
            const telefono = document.getElementById('telefono').value;
            const observaciones = document.getElementById('observaciones').value;
            
            const checkboxes = document.querySelectorAll('input[name="padecimiento"]:checked');
            const padecimientos = Array.from(checkboxes).map(cb => cb.value);
            const foto = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150';

            const patientData = { nombre, edad, telefono, padecimientos, observaciones, foto };
            
            let error;
            if (editId) {
                const { err } = await _supabase.from('pacientes').update(patientData).eq('id', editId);
                error = err;
            } else {
                patientData.id = 'pac_' + Date.now();
                const { err } = await _supabase.from('pacientes').insert([patientData]);
                error = err;
            }

            if (error) {
                alert('Error al guardar: ' + error.message);
                return;
            }

            await loadDataFromCloud();
            closeModal('patientModal');
            document.getElementById('patientForm').reset();
        }

        async function deletePatient(id) {
            if (confirm('¿Estás seguro de eliminar este paciente? Se eliminarán también sus registros.')) {
                const { error } = await _supabase.from('pacientes').delete().eq('id', id);
                if (error) {
                    alert('Error al eliminar: ' + error.message);
                    return;
                }
                await loadDataFromCloud();
            }
        }

        async function saveAppointment(e) {
            e.preventDefault();
            const editId = document.getElementById('editAppointmentId').value;
            const consultorio = document.getElementById('citaConsultorio').value;
            const motivoInput = document.getElementById('citaMotivo').value || 'Consulta podológica';
            const motivoFinal = `[${consultorio}] ${motivoInput}`;

            const citaData = {
                paciente_id: document.getElementById('citaPacienteId').value,
                fecha: document.getElementById('citaFecha').value,
                hora: document.getElementById('citaHora').value,
                motivo: motivoFinal
            };

            let error;
            if (editId) {
                const { err } = await _supabase.from('citas').update(citaData).eq('id', editId);
                error = err;
            } else {
                citaData.id = 'cit_' + Date.now();
                citaData.status = 'Programada';
                const { err } = await _supabase.from('citas').insert([citaData]);
                error = err;
            }

            if (error) {
                alert('Error al guardar la cita: ' + error.message);
                return;
            }

            await loadDataFromCloud();
            closeModal('appointmentModal');
            document.getElementById('appointmentForm').reset();
        }

        async function updateCitaStatus(id, newStatus) {
            const { error } = await _supabase.from('citas').update({ status: newStatus }).eq('id', id);
            if (error) {
                alert('Error al actualizar estado: ' + error.message);
                return;
            }
            await loadDataFromCloud();
        }

        async function deleteAppointment(id) {
            if (confirm('¿Deseas eliminar esta cita?')) {
                const { error } = await _supabase.from('citas').delete().eq('id', id);
                if (error) {
                    alert('Error al eliminar cita: ' + error.message);
                    return;
                }
                await loadDataFromCloud();
            }
        }

        function renderPatients(list = pacientes) {
            const grid = document.getElementById('patientsGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No hay pacientes registrados todavía.</div>`;
                return;
            }

            list.forEach(p => {
                const badges = p.padecimientos ? p.padecimientos.map(pad => `<span class="bg-teal-50 text-teal-700 border border-teal-100 px-2.5 py-0.5 rounded-lg text-[10px] font-semibold">${pad}</span>`).join('') : '';
                grid.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3 flex flex-col justify-between">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <img src="${p.foto}" class="w-12 h-12 rounded-full object-cover border border-slate-200">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-sm">${p.nombre}</h4>
                                        <p class="text-xs text-slate-500">Edad: ${p.edad} años • Tel: ${p.telefono || 'No registrado'}</p>
                                    </div>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="openPatientModal('${p.id}')" class="p-2 text-slate-400 hover:text-teal-600 transition-all cursor-pointer" title="Editar Paciente">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button onclick="deletePatient('${p.id}')" class="p-2 text-slate-400 hover:text-red-500 transition-all cursor-pointer" title="Eliminar Paciente">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1.5">${badges}</div>
                            <p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-100">${p.observaciones || 'Sin observaciones'}</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderAppointments() {
            const listContainer = document.getElementById('appointmentsList');
            const statusFilter = document.getElementById('filterCitaStatus').value;
            
            const filtered = citas.filter(c => statusFilter === 'todos' || c.status === statusFilter);
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No hay citas registradas.</div>`;
                return;
            }

            filtered.forEach(c => {
                const paciente = pacientes.find(p => p.id === c.paciente_id);
                const nombrePaciente = paciente ? paciente.nombre : 'Paciente general';
                
                let consultorioHTML = '';
                let motivoTexto = c.motivo || '';
                if (motivoTexto.startsWith('[Metepec]')) {
                    consultorioHTML = `<span class="bg-teal-50 text-teal-700 border border-teal-100 px-2 py-0.5 rounded-md text-[10px] font-bold"><i class="fa-solid fa-location-dot mr-1"></i>Metepec</span>`;
                    motivoTexto = motivoTexto.replace('[Metepec]', '').trim();
                } else if (motivoTexto.startsWith('[Toluca]')) {
                    consultorioHTML = `<span class="bg-teal-50 text-teal-700 border border-teal-100 px-2 py-0.5 rounded-md text-[10px] font-bold"><i class="fa-solid fa-location-dot mr-1"></i>Toluca</span>`;
                    motivoTexto = motivoTexto.replace('[Toluca]', '').trim();
                }

                listContainer.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3 flex flex-col justify-between">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-teal-600"><i class="fa-solid fa-calendar mr-1"></i> ${c.fecha} - ${c.hora} hrs</span>
                                ${consultorioHTML}
                            </div>
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-slate-900 text-sm">${nombrePaciente}</h4>
                                <div class="flex gap-1">
                                    <button onclick="openAppointmentModal('${c.id}')" class="p-1.5 text-slate-400 hover:text-teal-600 transition-all cursor-pointer" title="Editar Cita">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteAppointment('${c.id}')" class="p-1.5 text-slate-400 hover:text-red-500 transition-all cursor-pointer" title="Eliminar Cita">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500">Motivo: ${motivoTexto}</p>
                        </div>
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-[11px] font-semibold text-slate-500">Estado:</span>
                            <select onchange="updateCitaStatus('${c.id}', this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-teal-500 text-slate-700">
                                <option value="Programada" ${c.status === 'Programada' ? 'selected' : ''}>Programada</option>
                                <option value="Completada" ${c.status === 'Completada' ? 'selected' : ''}>Completada</option>
                                <option value="Cancelada" ${c.status === 'Cancelada' ? 'selected' : ''}>Cancelada</option>
                            </select>
                        </div>
                    </div>
                `;
            });
        }

        function updatePatientSelect() {
            const select = document.getElementById('citaPacienteId');
            select.innerHTML = '<option value="">Selecciona un paciente</option>';
            pacientes.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.nombre} (${p.telefono || 'Sin tel'})</option>`;
            });
        }

        function filterPatients() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const padecimientoFilter = document.getElementById('filterPadecimientosSelect').value;

            const filtered = pacientes.filter(p => {
                const matchText = p.nombre.toLowerCase().includes(query) || (p.telefono && p.telefono.includes(query));
                const matchPad = padecimientoFilter === 'todos' || (p.padecimientos && p.padecimientos.some(pad => pad.includes(padecimientoFilter)));
                return matchText && matchPad;
            });
            renderPatients(filtered);
        }
    </script>
</body>
</html>
