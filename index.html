<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie saludable - Sistema Podológico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pistachio: {
                            50: '#f4fbf7',
                            100: '#e6f7ec',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- Navegación Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <!-- Logotipo exacto basado en tu imagen (Piesito morado y verde pistache) -->
                <div class="bg-emerald-50 p-2 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-center w-12 h-12">
                    <svg viewBox="0 0 512 512" class="w-8 h-8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Dedo gordo (Morado) -->
                        <path d="M110 90C90 90 75 110 80 145C85 175 115 195 130 180C145 165 140 110 125 95C120 90 115 90 110 90Z" fill="#a21caf"/>
                        <!-- Dedos pequeños (Verde Pistache) -->
                        <ellipse cx="190" cy="85" rx="20" ry="35" transform="rotate(-10 190 85)" fill="#84cc16"/>
                        <ellipse cx="250" cy="85" rx="18" ry="32" transform="rotate(5 250 85)" fill="#84cc16"/>
                        <ellipse cx="305" cy="100" rx="16" ry="28" transform="rotate(20 305 100)" fill="#84cc16"/>
                        <ellipse cx="350" cy="130" rx="14" ry="24" transform="rotate(35 350 130)" fill="#84cc16"/>
                        <!-- Planta y talón del pie (S curva Morada y Verde) -->
                        <path d="M125 155C125 155 190 220 250 280C310 340 340 375 320 405C305 425 270 425 240 395C210 365 155 305 125 275C115 265 105 245 115 215C125 185 135 165 125 155Z" fill="#a21caf"/>
                        <path d="M225 385C200 395 180 390 170 375C155 355 175 335 205 325C235 315 275 330 290 355C305 380 285 415 240 435C220 444 195 440 180 425" stroke="#84cc16" stroke-width="20" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-wide">Pie saludable</h1>
                    <p class="text-xs text-slate-500">Sistema de Expedientes y Citas Podológicas</p>
                </div>
            </div>
            <!-- Botones de Pestañas -->
            <div class="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200 gap-1">
                <button onclick="switchTab('pacientes')" id="btn-tab-pacientes" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-emerald-600 text-white shadow">
                    <i class="fa-solid fa-users mr-2"></i>Pacientes
                </button>
                <button onclick="switchTab('citas')" id="btn-tab-citas" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-calendar-days mr-2"></i>Agenda de Citas
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- ================= VISTA PACIENTES ================= -->
        <div id="view-pacientes" class="space-y-6">
            <!-- Barra de Herramientas -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterPatients()" placeholder="Buscar por nombre o padecimiento..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900 placeholder-slate-400">
                </div>
                <button onclick="openModal('patientModal')" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Nuevo Paciente
                </button>
            </div>

            <!-- Grid de Pacientes -->
            <div id="patientsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

        <!-- ================= VISTA CITAS ================= -->
        <div id="view-citas" class="space-y-6 hidden">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <select id="filterCitaStatus" onchange="renderAppointments()" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:border-emerald-500">
                        <option value="todos">Todas las citas</option>
                        <option value="Programada">Programadas</option>
                        <option value="Completada">Completadas</option>
                        <option value="Cancelada">Canceladas</option>
                    </select>
                </div>
                <button onclick="openModal('appointmentModal')" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calendar-plus"></i> Agendar Cita
                </button>
            </div>

            <!-- Lista de Citas -->
            <div id="appointmentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

    </main>

    <!-- ================= MODAL: NUEVO / EDITAR PACIENTE ================= -->
    <div id="patientModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-6 space-y-6 shadow-xl my-8">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h3 id="patientModalTitle" class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-emerald-600"></i> Registrar Nuevo Paciente
                </h3>
                <button onclick="closeModal('patientModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="patientForm" onsubmit="savePatient(event)" class="space-y-4">
                <input type="hidden" id="patientId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo *</label>
                        <input type="text" id="nombre" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Edad *</label>
                        <input type="number" id="edad" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
                        <input type="tel" id="telefono" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fotografía del Paciente</label>
                        <input type="file" id="fotoFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-600 hover:file:bg-emerald-100 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">Padecimientos Podológicos Frecuentes</label>
                    <div id="padecimientosContainer" class="flex flex-wrap gap-2">
                        <!-- Checkboxes generados por JS -->
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Observaciones / Alergias / Medicamentos</label>
                    <textarea id="observaciones" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('patientModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Cancelar</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/20">Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: AGENDAR CITA ================= -->
    <div id="appointmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-emerald-600"></i> Agendar Nueva Cita
                </h3>
                <button onclick="closeModal('appointmentModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="appointmentForm" onsubmit="saveAppointment(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Paciente *</label>
                    <select id="citaPacienteId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                        <!-- Opciones de pacientes -->
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha *</label>
                        <input type="date" id="citaFecha" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hora *</label>
                        <input type="time" id="citaHora" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Motivo de la Cita / Tratamiento</label>
                    <input type="text" id="citaMotivo" placeholder="Ej. Corte clínico, revisión pie diabético..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-900">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('appointmentModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Cancelar</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/20">Agendar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: EXPEDIENTE DETALLADO ================= -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-2xl w-full p-6 space-y-6 shadow-xl my-8">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-file-medical text-emerald-600"></i> Expediente Clínico del Paciente
                </h3>
                <button onclick="closeModal('detailModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div id="detailContent" class="space-y-6">
                <!-- Inyección detallada -->
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD -->
    <script>
        const padecimientosDisponibles = [
            "Diabetes Mellitus (Pie Diabético)",
            "Onicocriptosis (Uña encarnada)",
            "Onicomicosis (Hongos en uñas)",
            "Pie de Atleta",
            "Callosidades / Tilomas",
            "Hiperqueratosis",
            "Verrugas Plantares",
            "Pie Plano / Arco Vencido"
        ];

        let pacientes = JSON.parse(localStorage.getItem('piesaludable_pacientes')) || [];
        let citas = JSON.parse(localStorage.getItem('piesaludable_citas')) || [];

        window.onload = function() {
            renderPadecimientosCheckboxes();
            renderPatients();
            renderAppointments();
            updatePatientSelect();
        };

        function switchTab(tab) {
            const btnPacientes = document.getElementById('btn-tab-pacientes');
            const btnCitas = document.getElementById('btn-tab-citas');
            const viewPacientes = document.getElementById('view-pacientes');
            const viewCitas = document.getElementById('view-citas');

            if (tab === 'pacientes') {
                btnPacientes.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all bg-emerald-600 text-white shadow";
                btnCitas.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-slate-900";
                viewPacientes.classList.remove('hidden');
                viewCitas.classList.add('hidden');
            } else {
                btnCitas.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all bg-emerald-600 text-white shadow";
                btnPacientes.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-600 hover:text-slate-900";
                viewCitas.classList.remove('hidden');
                viewPacientes.classList.add('hidden');
            }
        }

        function renderPadecimientosCheckboxes(selected = []) {
            const container = document.getElementById('padecimientosContainer');
            container.innerHTML = '';
            padecimientosDisponibles.forEach(pad => {
                const isChecked = selected.includes(pad) ? 'checked' : '';
                container.innerHTML += `
                    <label class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs cursor-pointer hover:border-emerald-500/50">
                        <input type="checkbox" name="padecimiento" value="${pad}" ${isChecked} class="rounded border-slate-300 bg-white text-emerald-600 focus:ring-0">
                        <span class="text-slate-700">${pad}</span>
                    </label>
                `;
            });
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            if(modalId === 'patientModal' && !document.getElementById('patientId').value) {
                document.getElementById('patientForm').reset();
                document.getElementById('patientModalTitle').innerHTML = '<i class="fa-solid fa-user-pen text-emerald-600"></i> Registrar Nuevo Paciente';
                renderPadecimientosCheckboxes();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            if(modalId === 'patientModal') {
                document.getElementById('patientForm').reset();
                document.getElementById('patientId').value = '';
            }
        }

        function savePatient(e) {
            e.preventDefault();
            const id = document.getElementById('patientId').value || Date.now().toString();
            const nombre = document.getElementById('nombre').value;
            const edad = document.getElementById('edad').value;
            const telefono = document.getElementById('telefono').value;
            const observaciones = document.getElementById('observaciones').value;
            
            const checkboxes = document.querySelectorAll('input[name="padecimiento"]:checked');
            const padecimientos = Array.from(checkboxes).map(cb => cb.value);

            const fotoFile = document.getElementById('fotoFile').files[0];

            if (fotoFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    processPatientSave(id, nombre, edad, telefono, padecimientos, observaciones, uploadEvent.target.result);
                };
                reader.readAsDataURL(fotoFile);
            } else {
                const existing = pacientes.find(p => p.id === id);
                const foto = existing ? existing.foto : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150';
                processPatientSave(id, nombre, edad, telefono, padecimientos, observaciones, foto);
            }
        }

        function processPatientSave(id, nombre, edad, telefono, padecimientos, observaciones, foto) {
            const patientData = { id, nombre, edad, telefono, padecimientos, observaciones, foto };
            
            const index = pacientes.findIndex(p => p.id === id);
            if (index >= 0) {
                pacientes[index] = patientData;
            } else {
                pacientes.push(patientData);
            }

            localStorage.setItem('piesaludable_pacientes', JSON.stringify(pacientes));
            closeModal('patientModal');
            renderPatients();
            updatePatientSelect();
        }

        function renderPatients(list = pacientes) {
            const grid = document.getElementById('patientsGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No hay pacientes registrados todavía.</div>`;
                return;
            }

            list.forEach(p => {
                const isDiabetico = p.padecimientos.some(pad => pad.includes('Diabetes'));
                const badges = p.padecimientos.map(pad => `<span class="bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-lg text-[11px] text-slate-600">${pad}</span>`).join('');

                grid.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <img src="${p.foto}" alt="Foto" class="w-12 h-12 rounded-full object-cover border border-slate-200">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-base">${p.nombre}</h4>
                                        <p class="text-xs text-slate-500">${p.edad} años • <i class="fa-solid fa-phone text-[10px]"></i> ${p.telefono || 'Sin teléfono'}</p>
                                    </div>
                                </div>
                            </div>
                            ${isDiabetico ? '<div class="mt-3 bg-red-50 border border-red-200 text-red-600 text-xs px-3 py-1.5 rounded-xl font-medium flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Paciente con Diabetes (Precaución)</div>' : ''}
                            <div class="flex flex-wrap gap-1.5 mt-3">
                                ${badges || '<span class="text-xs text-slate-400">Sin padecimientos marcados</span>'}
                            </div>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-slate-100">
                            <button onclick="viewDetail('${p.id}')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-semibold transition-all">Ver Expediente</button>
                            <button onclick="editPatient('${p.id}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 px-3 py-2 rounded-xl text-xs transition-all"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deletePatient('${p.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-xl text-xs transition-all"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function filterPatients() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = pacientes.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                p.padecimientos.some(pad => pad.toLowerCase().includes(query))
            );
            renderPatients(filtered);
        }

        function editPatient(id) {
            const p = pacientes.find(item => item.id === id);
            if(!p) return;
            document.getElementById('patientId').value = p.id;
            document.getElementById('nombre').value = p.nombre;
            document.getElementById('edad').value = p.edad;
            document.getElementById('telefono').value = p.telefono || '';
            document.getElementById('observaciones').value = p.observaciones || '';
            document.getElementById('patientModalTitle').innerHTML = '<i class="fa-solid fa-user-pen text-emerald-600"></i> Editar Paciente';
            renderPadecimientosCheckboxes(p.padecimientos);
            openModal('patientModal');
        }

        function deletePatient(id) {
            if(confirm('¿Estás seguro de eliminar este paciente y su historial?')) {
                pacientes = pacientes.filter(p => p.id !== id);
                citas = citas.filter(c => c.pacienteId !== id);
                localStorage.setItem('piesaludable_pacientes', JSON.stringify(pacientes));
                localStorage.setItem('piesaludable_citas', JSON.stringify(citas));
                renderPatients();
                renderAppointments();
                updatePatientSelect();
            }
        }

        function viewDetail(id) {
            const p = pacientes.find(item => item.id === id);
            if(!p) return;

            const patientCitas = citas.filter(c => c.pacienteId === id);
            const citasHtml = patientCitas.length > 0 ? patientCitas.map(c => `
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <p class="font-semibold text-slate-800"><i class="fa-regular fa-calendar mr-1.5 text-emerald-600"></i>${c.fecha} a las ${c.hora}</p>
                        <p class="text-slate-500 mt-0.5">${c.motivo || 'Sin motivo especificado'}</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg font-medium ${c.status === 'Completada' ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : c.status === 'Cancelada' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-amber-100 text-amber-700 border border-amber-200'}">${c.status}</span>
                </div>
            `).join('') : '<p class="text-xs text-slate-400">No hay citas registradas para este paciente.</p>';

            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <div class="flex items-center gap-4 border-b border-slate-100 pb-4">
                    <img src="${p.foto}" class="w-16 h-16 rounded-2xl object-cover border border-slate-200">
                    <div>
                        <h4 class="text-lg font-bold text-slate-900">${p.nombre}</h4>
                        <p class="text-xs text-slate-500">${p.edad} años • Tel: ${p.telefono || 'No registrado'}</p>
                    </div>
                </div>
                <div>
                    <h5 class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-2">Padecimientos</h5>
                    <div class="flex flex-wrap gap-1.5">
                        ${p.padecimientos.map(pad => `<span class="bg-slate-100 border border-slate-200 px-3 py-1 rounded-xl text-xs text-slate-700">${pad}</span>`).join('') || 'Ninguno'}
                    </div>
                </div>
                <div>
                    <h5 class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-2">Observaciones Clínicas</h5>
                    <p class="text-sm bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-slate-700">${p.observaciones || 'Sin observaciones.'}</p>
                </div>
                <div>
                    <h5 class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-2">Historial de Citas</h5>
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        ${citasHtml}
                    </div>
                </div>
            `;
            openModal('detailModal');
        }

        // FUNCIONES DE CITAS
        function updatePatientSelect() {
            const select = document.getElementById('citaPacienteId');
            select.innerHTML = '<option value="">Selecciona un paciente</option>';
            pacientes.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
            });
        }

        function saveAppointment(e) {
            e.preventDefault();
            const pacienteId = document.getElementById('citaPacienteId').value;
            const fecha = document.getElementById('citaFecha').value;
            const hora = document.getElementById('citaHora').value;
            const motivo = document.getElementById('citaMotivo').value;

            const nuevaCita = {
                id: Date.now().toString(),
                pacienteId,
                fecha,
                hora,
                motivo,
                status: 'Programada'
            };

            citas.push(nuevaCita);
            localStorage.setItem('piesaludable_citas', JSON.stringify(citas));
            closeModal('appointmentModal');
            document.getElementById('appointmentForm').reset();
            renderAppointments();
        }

        function renderAppointments() {
            const listContainer = document.getElementById('appointmentsList');
            const statusFilter = document.getElementById('filterCitaStatus').value;
            listContainer.innerHTML = '';

            let filtered = citas;
            if (statusFilter !== 'todos') {
                filtered = citas.filter(c => c.status === statusFilter);
            }

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No hay citas registradas.</div>`;
                return;
            }

            filtered.sort((a,b) => new Date(a.fecha + ' ' + a.hora) - new Date(b.fecha + ' ' + b.hora));

            filtered.forEach(c => {
                const paciente = pacientes.find(p => p.id === c.pacienteId) || { nombre: 'Paciente desconocido', foto: '' };
                const statusColor = c.status === 'Completada' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : c.status === 'Cancelada' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-amber-100 text-amber-700 border-amber-200';

                listContainer.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 flex flex-col justify-between shadow-sm">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${statusColor}">${c.status}</span>
                                <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${c.hora}</span>
                            </div>
                            <div class="flex items-center gap-3 mb-3">
                                <div class="bg-emerald-100 p-2.5 rounded-xl border border-emerald-200 text-emerald-600">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-900 text-sm">${paciente.nombre}</h4>
                                    <p class="text-xs text-emerald-600 font-medium">${c.fecha}</p>
                                </div>
                            </div>
                            <p class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200"><strong>Motivo:</strong> ${c.motivo || 'Consulta general'}</p>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-slate-100">
                            <select onchange="updateCitaStatus('${c.id}', this.value)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 text-xs text-slate-700 focus:outline-none">
                                <option value="" disabled selected>Cambiar estado</option>
                                <option value="Programada">Programada</option>
                                <option value="Completada">Completada</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                            <button onclick="deleteCita('${c.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-xs transition-all"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function updateCitaStatus(id, newStatus) {
            const c = citas.find(item => item.id === id);
            if (c) {
                c.status = newStatus;
                localStorage.setItem('piesaludable_citas', JSON.stringify(citas));
                renderAppointments();
            }
        }

        function deleteCita(id) {
            if(confirm('¿Deseas eliminar esta cita?')) {
                citas = citas.filter(c => c.id !== id);
                localStorage.setItem('piesaludable_citas', JSON.stringify(citas));
                renderAppointments();
            }
        }
    </script>
</body>
</html>
